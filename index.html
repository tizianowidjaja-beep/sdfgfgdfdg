<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Void: Boss Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a0f; overflow: hidden; font-family: 'Orbitron', monospace; color: white; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; z-index: 10; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .score-label { font-size: 12px; color: #0ff; opacity: 0.8; letter-spacing: 2px; }
        .score-value { font-size: 36px; font-weight: 900; text-shadow: 0 0 20px #0ff; }
        .highscore-value { font-size: 14px; color: #f0f; margin-top: 5px; text-shadow: 0 0 10px #f0f; }
        .boss-hud { text-align: center; display: none; }
        .boss-name { font-size: 18px; color: #f44; letter-spacing: 4px; margin-bottom: 8px; text-shadow: 0 0 15px #f44; animation: bossPulse 1s infinite; }
        .boss-hp-bg { width: 400px; height: 12px; background: rgba(255,0,0,0.2); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,0,0,0.4); margin: 0 auto; }
        .boss-hp-fill { height: 100%; background: linear-gradient(90deg, #f44, #f0f); width: 100%; transition: width 0.3s; box-shadow: 0 0 15px #f44; }
        .boss-phase { font-size: 11px; color: #f0f; margin-top: 5px; letter-spacing: 2px; }
        @keyframes bossPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .speed-bar-container { width: 200px; text-align: right; }
        .speed-label { font-size: 12px; color: #f0f; opacity: 0.8; letter-spacing: 2px; margin-bottom: 5px; }
        .speed-bar-bg { width: 100%; height: 8px; background: rgba(255,0,255,0.2); border-radius: 4px; overflow: hidden; }
        .speed-bar-fill { height: 100%; background: #f0f; width: 10%; transition: width 0.3s; box-shadow: 0 0 10px #f0f; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,15,0.9); backdrop-filter: blur(5px); pointer-events: auto; transition: opacity 0.3s; z-index: 20; }
        .screen.hidden { opacity: 0; pointer-events: none; }
        h1 { font-size: 56px; font-weight: 900; letter-spacing: 8px; background: linear-gradient(180deg, #0ff, #f0f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 40px rgba(0,255,255,0.3); margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #888; letter-spacing: 4px; margin-bottom: 40px; }
        .btn { padding: 18px 50px; font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 700; color: #0a0a0f; background: #0ff; border: none; cursor: pointer; letter-spacing: 3px; text-transform: uppercase; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: all 0.2s; }
        .btn:hover { background: #fff; transform: scale(1.05); box-shadow: 0 0 30px #0ff; }
        .controls-hint { margin-top: 30px; font-size: 12px; color: #555; letter-spacing: 2px; text-align: center; line-height: 2; }
        .key { display: inline-block; padding: 3px 10px; border: 1px solid #444; border-radius: 4px; color: #aaa; margin: 0 2px; }
        .game-over-score { font-size: 48px; font-weight: 900; color: #f0f; text-shadow: 0 0 30px #f0f; margin: 20px 0; }
        .game-over-label { font-size: 14px; color: #888; letter-spacing: 3px; }
        .music-note { font-size: 11px; color: #555; margin-top: 15px; letter-spacing: 1px; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px); pointer-events: none; z-index: 100; }
        .warning-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; opacity: 0; }
        .warning-overlay.active { animation: warningFlash 0.3s ease-out; }
        @keyframes warningFlash { 0% { background: rgba(255,0,0,0.3); opacity: 1; } 100% { background: transparent; opacity: 0; } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="scanlines"></div>
    <div class="warning-overlay" id="warningOverlay"></div>
    <div id="ytPlayer" style="position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div>
                <div class="score-label">SCORE</div>
                <div class="score-value" id="scoreDisplay">0</div>
                <div class="highscore-value" id="highScoreDisplay">BEST: 0</div>
            </div>
            <div class="boss-hud" id="bossHud">
                <div class="boss-name" id="bossName">⚠ VOID SENTINEL ⚠</div>
                <div class="boss-hp-bg"><div class="boss-hp-fill" id="bossHpBar"></div></div>
                <div class="boss-phase" id="bossPhase">PHASE 1: METEOR RAIN</div>
            </div>
            <div class="speed-bar-container">
                <div class="speed-label">VELOCITY</div>
                <div class="speed-bar-bg"><div class="speed-bar-fill" id="speedBar"></div></div>
            </div>
        </div>
    </div>

    <div class="screen" id="startScreen">
        <h1>NEON VOID</h1>
        <div class="subtitle">BOSS EDITION</div>
        <!-- FIX: onclick langsung, tidak ada addEventListener terpisah -->
        <button class="btn" onclick="initAndStart()">START RUN</button>
        <div class="controls-hint">
            <span class="key">←</span> <span class="key">→</span> atau <span class="key">A</span> <span class="key">D</span> bergerak<br>
            <span class="key">SPACE</span> dash / boost<br>
            <span class="key">↑</span> <span class="key">↓</span> atau <span class="key">W</span> <span class="key">S</span> gerak vertikal (saat boss)
        </div>
        <div class="music-note">🎵 Klik START untuk memutar musik (YouTube Audio Loop)</div>
    </div>

    <div class="screen hidden" id="gameOverScreen">
        <div class="game-over-label">SYSTEM FAILURE</div>
        <div class="game-over-score" id="finalScore">0</div>
        <div class="game-over-label" style="margin-bottom:30px;">FINAL SCORE</div>
        <button class="btn" onclick="restartGame()">RETRY</button>
    </div>

    <script>
        // ============================================
        // 🎵 YOUTUBE AUDIO - FIXED INITIALIZATION
        // ============================================
        let ytPlayerObj = null;
        let ytReady = false;
        const VIDEO_ID = 'oJuGlqO85YI';

        function loadYTAPI() {
            if (typeof YT !== 'undefined') { createYTPlayer(); return; }
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(tag);
        }

        // Callback global yang dipanggil YouTube API
        window.onYouTubeIframeAPIReady = function() {
            createYTPlayer();
        };

        function createYTPlayer() {
            try {
                ytPlayerObj = new YT.Player('ytPlayer', {
                    height: '1', width: '1',
                    videoId: VIDEO_ID,
                    playerVars: {
                        autoplay: 0, loop: 1, playlist: VIDEO_ID,
                        controls: 0, showinfo: 0, rel: 0, iv_load_policy: 3,
                        modestbranding: 1, disablekb: 1
                    },
                    events: {
                        onReady: function() { ytReady = true; console.log('YT Player Ready'); },
                        onStateChange: function(e) {
                            // Auto-loop: jika ended, play ulang
                            if (e.data === YT.PlayerState.ENDED) {
                                ytPlayerObj.seekTo(0);
                                ytPlayerObj.playVideo();
                            }
                        },
                        onError: function(e) { console.warn('YT Error:', e.data); }
                    }
                });
            } catch(err) { console.warn('YT init failed:', err); }
        }

        function playMusic() {
            if (ytReady && ytPlayerObj && typeof ytPlayerObj.playVideo === 'function') {
                ytPlayerObj.setVolume(70);
                ytPlayerObj.playVideo();
            } else {
                // Retry setelah delay jika belum ready
                setTimeout(playMusic, 500);
            }
        }

        function stopMusic() {
            if (ytReady && ytPlayerObj && typeof ytPlayerObj.pauseVideo === 'function') {
                ytPlayerObj.pauseVideo();
            }
        }

        // Load API segera
        loadYTAPI();

        // ============================================
        // 🎮 GAME ENGINE
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const warningOverlay = document.getElementById('warningOverlay');

        let gameState = 'MENU';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('neonVoidBossHS')) || 0;
        let speed = 5, baseSpeed = 5, maxSpeed = 20;
        let frameCount = 0;
        let dashCooldown = 0, isDashing = false;

        const player = { x: 0, y: 0, w: 28, h: 28, lane: 1, targetX: 0, targetY: 0, color: '#0ff' };
        let currentLanes = [-1, 0, 1];
        let LANE_WIDTH = 120;
        let arenaExpanded = false;

        let obstacles = [];
        let particles = [];
        let stars = [];
        let gridOffset = 0;

        const boss = {
            active: false, hp: 100, maxHp: 100, phase: 0,
            attackTimer: 0, y: -200, targetY: 120,
            patterns: ['meteor', 'expand', 'laser', 'shockwave', 'chaos'],
            currentPattern: '',
            laserX: 0, laserActive: false,
            shockwaveRadius: 0, shockwaveActive: false
        };

        const BOSS_TRIGGER_SCORE = 3000;
        const PHASE_NAMES = [
            "PHASE 1: METEOR RAIN",
            "PHASE 2: PANEL EXPANSION (7 LANES)",
            "PHASE 3: LASER SWEEP",
            "PHASE 4: SHOCKWAVE PULSE",
            "PHASE 5: CHAOS BARRAGE"
        ];

        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const speedBar = document.getElementById('speedBar');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const bossHud = document.getElementById('bossHud');
        const bossHpBar = document.getElementById('bossHpBar');
        const bossPhaseEl = document.getElementById('bossPhase');
        const bossNameEl = document.getElementById('bossName');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 150;
            player.targetY = player.y;
        }
        window.addEventListener('resize', resize);
        resize();

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (gameState !== 'PLAYING') return;
            const maxLane = currentLanes.length - 1;
            if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && player.lane > 0) { player.lane--; spawnTrail(player.x, player.y, '#0ff', 5); }
            if ((e.code === 'ArrowRight' || e.code === 'KeyD') && player.lane < maxLane) { player.lane++; spawnTrail(player.x, player.y, '#0ff', 5); }
            if (boss.active) {
                if ((e.code === 'ArrowUp' || e.code === 'KeyW') && player.targetY > canvas.height * 0.4) player.targetY -= 60;
                if ((e.code === 'ArrowDown' || e.code === 'KeyS') && player.targetY < canvas.height - 80) player.targetY += 60;
            }
            if (e.code === 'Space' && dashCooldown <= 0) {
                isDashing = true; dashCooldown = 120;
                speed = Math.min(speed + 10, maxSpeed + 10);
                spawnTrail(player.x, player.y, '#fff', 20);
                setTimeout(() => { isDashing = false; }, 300);
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // ============================================
        // ✅ FIXED: Single entry point functions
        // ============================================
        function initAndStart() {
            playMusic();
            startGame();
        }

        function restartGame() {
            playMusic();
            startGame();
        }

        function startGame() {
            gameState = 'PLAYING';
            score = 0; speed = baseSpeed; frameCount = 0;
            player.lane = 1; player.targetY = canvas.height - 150;
            obstacles = []; particles = [];
            dashCooldown = 0;
            currentLanes = [-1, 0, 1]; arenaExpanded = false;
            boss.active = false; boss.hp = boss.maxHp; boss.phase = 0;
            boss.attackTimer = 0; boss.laserActive = false;
            boss.shockwaveActive = false; boss.y = -200;

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            bossHud.style.display = 'none';
            highScoreDisplay.innerText = 'BEST: ' + highScore.toLocaleString();

            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 2 + 0.5 });
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            stopMusic();
            if (score > highScore) { highScore = score; localStorage.setItem('neonVoidBossHS', highScore); }
            finalScoreEl.innerText = score.toLocaleString();
            gameOverScreen.classList.remove('hidden');
            spawnTrail(player.x, player.y, '#f0f', 50);
        }

        function spawnTrail(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 20, y: y + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 + 2,
                    life: 1, decay: 0.02 + Math.random() * 0.03,
                    size: Math.random() * 4 + 1, color: color
                });
            }
        }

        function triggerWarning() {
            warningOverlay.classList.remove('active');
            void warningOverlay.offsetWidth;
            warningOverlay.classList.add('active');
        }

        // ============================================
        // BOSS SYSTEM
        // ============================================
        function activateBoss() {
            boss.active = true; boss.hp = boss.maxHp; boss.phase = 0; boss.y = -200;
            bossHud.style.display = 'block';
            bossNameEl.innerText = "⚠ VOID SENTINEL ⚠";
            triggerWarning();
        }

        function updateBoss() {
            if (!boss.active) return;
            if (boss.y < boss.targetY) { boss.y += 3; return; }

            boss.attackTimer++;
            const pattern = boss.patterns[boss.phase % boss.patterns.length];
            boss.currentPattern = pattern;
            bossPhaseEl.innerText = PHASE_NAMES[boss.phase % PHASE_NAMES.length];

            const hpPct = boss.hp / boss.maxHp;
            if (hpPct < 0.8 && boss.phase === 0) { boss.phase = 1; boss.attackTimer = 0; expandArena(7); triggerWarning(); }
            else if (hpPct < 0.6 && boss.phase === 1) { boss.phase = 2; boss.attackTimer = 0; triggerWarning(); }
            else if (hpPct < 0.4 && boss.phase === 2) { boss.phase = 3; boss.attackTimer = 0; triggerWarning(); }
            else if (hpPct < 0.2 && boss.phase === 3) { boss.phase = 4; boss.attackTimer = 0; triggerWarning(); }

            switch (pattern) {
                case 'meteor': bossMeteor(); break;
                case 'expand': bossExpand(); break;
                case 'laser': bossLaser(); break;
                case 'shockwave': bossShockwave(); break;
                case 'chaos': bossChaos(); break;
            }

            if (frameCount % 10 === 0) {
                boss.hp -= 0.15;
                if (boss.hp <= 0) bossDefeated();
            }
            bossHpBar.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
        }

        function bossMeteor() {
            if (boss.attackTimer % 90 === 0) {
                triggerWarning();
                for (let l = 0; l < 3; l++) {
                    obstacles.push({
                        x: canvas.width / 2 + [-1, 0, 1][l] * LANE_WIDTH,
                        y: -80, w: 60, h: 60, type: 'meteor',
                        color: '#f44', vy: speed * 1.5, blastRadius: LANE_WIDTH * 0.8
                    });
                }
            }
        }

        function bossExpand() {
            if (boss.attackTimer % 70 === 0) {
                triggerWarning();
                const safeLane = Math.floor(Math.random() * currentLanes.length);
                for (let i = 0; i < currentLanes.length; i++) {
                    if (i === safeLane) continue;
                    if (Math.random() < 0.6) {
                        obstacles.push({
                            x: canvas.width / 2 + currentLanes[i] * (LANE_WIDTH * 0.8),
                            y: -60, w: 35, h: 35, type: 'expand_bolt',
                            color: '#f0f', vy: speed * 2, blastRadius: 30
                        });
                    }
                }
            }
        }

        function bossLaser() {
            if (boss.attackTimer % 200 === 0) {
                boss.laserActive = true;
                boss.laserX = canvas.width / 2 + currentLanes[0] * LANE_WIDTH - LANE_WIDTH;
                triggerWarning();
            }
            if (boss.laserActive) {
                boss.laserX += 8;
                if (Math.abs(player.x - boss.laserX) < 40 && !isDashing) { gameOver(); return; }
                const rightEdge = canvas.width / 2 + currentLanes[currentLanes.length - 1] * LANE_WIDTH + LANE_WIDTH;
                if (boss.laserX > rightEdge) boss.laserActive = false;
            }
        }

        function bossShockwave() {
            if (boss.attackTimer % 150 === 0) {
                boss.shockwaveActive = true; boss.shockwaveRadius = 0; triggerWarning();
            }
            if (boss.shockwaveActive) {
                boss.shockwaveRadius += 6;
                const cx = canvas.width / 2, cy = boss.y + 50;
                const dist = Math.sqrt((player.x - cx) ** 2 + (player.y - cy) ** 2);
                if (Math.abs(dist - boss.shockwaveRadius) < 35 && !isDashing) { gameOver(); return; }
                if (boss.shockwaveRadius > canvas.width) boss.shockwaveActive = false;
            }
        }

        function bossChaos() {
            if (boss.attackTimer % 40 === 0) {
                triggerWarning();
                const sub = Math.floor(Math.random() * 4);
                const elw = LANE_WIDTH * 0.8;
                if (sub === 0) {
                    const ml = Math.floor(Math.random() * currentLanes.length);
                    obstacles.push({ x: canvas.width / 2 + currentLanes[ml] * elw, y: -60, w: 50, h: 50, type: 'meteor', color: '#f44', vy: speed * 2.5, blastRadius: LANE_WIDTH * 0.6 });
                } else if (sub === 1) {
                    for (let i = 0; i < 3; i++) {
                        const bl = Math.floor(Math.random() * currentLanes.length);
                        obstacles.push({ x: canvas.width / 2 + currentLanes[bl] * elw, y: -60 - i * 40, w: 30, h: 30, type: 'expand_bolt', color: '#f0f', vy: speed * 2, blastRadius: 25 });
                    }
                } else if (sub === 2) {
                    boss.laserActive = true;
                    boss.laserX = player.x + (Math.random() > 0.5 ? 200 : -200);
                } else {
                    boss.shockwaveActive = true; boss.shockwaveRadius = 0;
                }
            }
        }

        function expandArena(numLanes) {
            arenaExpanded = true; currentLanes = [];
            const half = Math.floor(numLanes / 2);
            for (let i = -half; i <= half; i++) currentLanes.push(i);
            LANE_WIDTH = Math.min(120, (canvas.width * 0.8) / numLanes);
            player.lane = Math.floor(currentLanes.length / 2);
        }

        function bossDefeated() {
            boss.active = false; bossHud.style.display = 'none';
            arenaExpanded = false; currentLanes = [-1, 0, 1]; LANE_WIDTH = 120; player.lane = 1;
            score += 10000; baseSpeed += 3;
            spawnTrail(canvas.width / 2, boss.y, '#0ff', 100);
            spawnTrail(canvas.width / 2, boss.y, '#f0f', 80);
        }

        // ============================================
        // UPDATE & DRAW
        // ============================================
        function update() {
            if (gameState !== 'PLAYING') return;
            frameCount++;
            if (!boss.active && speed < maxSpeed) speed += 0.002;
            if (dashCooldown > 0) dashCooldown--;
            if (!isDashing && dashCooldown < 90 && speed > baseSpeed + frameCount * 0.001) speed -= 0.2;
            score += Math.floor(boss.active ? speed * 2 : speed);
            gridOffset = (gridOffset + speed) % 80;

            if (!boss.active && score >= BOSS_TRIGGER_SCORE && boss.phase === 0 && !arenaExpanded) activateBoss();
            if (!boss.active && score > BOSS_TRIGGER_SCORE + 15000 * Math.floor(score / 15000)) { boss.maxHp += 20; activateBoss(); }

            const elw = arenaExpanded ? LANE_WIDTH * 0.8 : LANE_WIDTH;
            player.targetX = canvas.width / 2 + currentLanes[player.lane] * elw;
            player.x += (player.targetX - player.x) * 0.15;
            player.y += (player.targetY - player.y) * 0.12;
            if (!boss.active) player.targetY = canvas.height - 150;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i]; obs.y += obs.vy || speed;
                const dx = player.x - obs.x, dy = player.y - obs.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const hitDist = obs.blastRadius || (obs.w / 2 + player.w / 2);
                if (dist < hitDist && !isDashing) { gameOver(); return; }
                if (obs.y > canvas.height + 100) obstacles.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
            stars.forEach(s => { s.y += s.speed * (speed / baseSpeed); if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; } });
            if (frameCount % 3 === 0) spawnTrail(player.x, player.y + 15, isDashing ? '#fff' : '#0ff', 1);
            updateBoss();
        }

        function draw() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => { ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + Math.random() * 0.3) + ')'; ctx.fillRect(s.x, s.y, s.size, s.size); });

            const cx = canvas.width / 2, horizon = canvas.height * 0.3;
            const elw = arenaExpanded ? LANE_WIDTH * 0.8 : LANE_WIDTH;
            ctx.strokeStyle = boss.active ? 'rgba(255,0,100,0.12)' : 'rgba(0,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = -8; i <= 8; i++) { ctx.beginPath(); ctx.moveTo(cx + i * elw, canvas.height); ctx.lineTo(cx + i * 15, horizon); ctx.stroke(); }
            for (let i = 0; i < 15; i++) {
                const y = horizon + ((i * 80 + gridOffset) / (canvas.height - horizon)) * (canvas.height - horizon);
                if (y > canvas.height) continue;
                ctx.globalAlpha = ((y - horizon) / (canvas.height - horizon)) * 0.3;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
            ctx.globalAlpha = 1;

            ctx.strokeStyle = boss.active ? 'rgba(255,0,100,0.2)' : 'rgba(255,0,255,0.15)';
            ctx.lineWidth = 2;
            currentLanes.forEach(l => {
                ctx.beginPath(); ctx.moveTo(cx + l * elw - 20, canvas.height); ctx.lineTo(cx + l * 8 - 3, horizon);
                ctx.moveTo(cx + l * elw + 20, canvas.height); ctx.lineTo(cx + l * 8 + 3, horizon); ctx.stroke();
            });

            if (boss.active && boss.y >= -100) {
                ctx.shadowBlur = 30; ctx.shadowColor = '#f44'; ctx.fillStyle = '#f44';
                ctx.beginPath(); ctx.moveTo(cx, boss.y - 50); ctx.lineTo(cx + 60, boss.y + 20);
                ctx.lineTo(cx + 30, boss.y + 50); ctx.lineTo(cx - 30, boss.y + 50);
                ctx.lineTo(cx - 60, boss.y + 20); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, boss.y + 5, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f0f'; ctx.beginPath(); ctx.arc(cx, boss.y + 5, 6, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                if (boss.laserActive) {
                    ctx.shadowBlur = 20; ctx.shadowColor = '#f44'; ctx.strokeStyle = '#f44'; ctx.lineWidth = 8;
                    ctx.beginPath(); ctx.moveTo(boss.laserX, boss.y + 50); ctx.lineTo(boss.laserX, canvas.height); ctx.stroke();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(boss.laserX, boss.y + 50); ctx.lineTo(boss.laserX, canvas.height); ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                if (boss.shockwaveActive) {
                    ctx.shadowBlur = 15; ctx.shadowColor = '#f0f';
                    ctx.strokeStyle = 'rgba(255,0,255,' + Math.max(0, 1 - boss.shockwaveRadius / canvas.width) + ')';
                    ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, boss.y + 50, boss.shockwaveRadius, 0, Math.PI * 2); ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            obstacles.forEach(obs => {
                ctx.shadowBlur = 15; ctx.shadowColor = obs.color; ctx.fillStyle = obs.color;
                if (obs.type === 'meteor') {
                    ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.w / 2, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,68,68,0.3)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.blastRadius, 0, Math.PI * 2); ctx.stroke();
                } else {
                    ctx.beginPath(); ctx.moveTo(obs.x, obs.y - obs.h / 2); ctx.lineTo(obs.x + obs.w / 2, obs.y);
                    ctx.lineTo(obs.x, obs.y + obs.h / 2); ctx.lineTo(obs.x - obs.w / 2, obs.y); ctx.closePath(); ctx.fill();
                }
                ctx.shadowBlur = 0;
            });

            if (gameState === 'PLAYING') {
                ctx.shadowBlur = isDashing ? 30 : 20; ctx.shadowColor = isDashing ? '#fff' : '#0ff';
                ctx.fillStyle = isDashing ? '#fff' : '#0ff';
                ctx.beginPath(); ctx.moveTo(player.x, player.y - player.h / 2);
                ctx.lineTo(player.x + player.w / 2, player.y + player.h / 2);
                ctx.lineTo(player.x, player.y + player.h / 3);
                ctx.lineTo(player.x - player.w / 2, player.y + player.h / 2);
                ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
            }

            particles.forEach(p => {
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            });
            ctx.globalAlpha = 1;

            scoreDisplay.innerText = score.toLocaleString();
            const sp = Math.min(((speed - baseSpeed) / (maxSpeed - baseSpeed)) * 100, 100);
            speedBar.style.width = Math.max(sp, 5) + '%';
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        highScoreDisplay.innerText = 'BEST: ' + highScore.toLocaleString();
        loop();
    </script>
</body>
</html>
